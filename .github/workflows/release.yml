# Publishes a version to the public repo (pokemon-canvas): push a tag like v192
# here (in the private development repo), and this
#   1. builds the release version (no debug menus),
#   2. makes the BPS patch against a clean Pokémon FireRed (USA) Rev 1 (v1.1), kept as an
#      asset of this repo's private "base-rom" release (never in the code),
#   3. copies the code (as of the tag) to the public repo,
#   4. publishes a release there with the patch and the version's changes.
# Needs the secret PUBLIC_REPO_TOKEN: a GitHub token that can write the public
# repo's contents and workflows. See RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version to release (an existing tag, e.g. v0.2)'
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'nmoore0518/gym-trainer-hack'
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: nmoore0518/pokemon-canvas
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 g++

      - name: Build the release version
        run: make firered RELEASE=1 -j$(nproc) -O

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Player's Guide and Pokédex
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python3 -m pip install --quiet pillow playwright
          python3 -m playwright install --with-deps chromium
          mkdir -p build/guide
          python3 tools/gym_hack/guide/build_guide.py --out Pokemon-Canvas-Players-Guide.pdf
          python3 tools/gym_hack/guide/build_dex.py --out Pokemon-Canvas-Pokedex.pdf
          ls -l *.pdf

      - name: Get the clean FireRed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir base
          gh release download base-rom --pattern '*.gba' --dir base
          mv base/*.gba base/firered.gba
          sha1sum base/firered.gba
          # The one ROM every player must patch: FireRed (USA) Rev 1 (v1.1).
          want=dd5945db9b930750cb39d00c84da8571feebf417
          have=$(sha1sum base/firered.gba | cut -d' ' -f1)
          if [ "$have" != "$want" ]; then
            echo "::error::The base-rom release must hold a clean Pokémon FireRed (USA) Rev 1 / v1.1 (SHA1 $want, found $have)"
            exit 1
          fi

      - name: Make the patch
        run: |
          git clone --depth 1 https://github.com/Alcaro/Flips /tmp/flips
          make -C /tmp/flips TARGET=cli CFLAGS=-O2
          /tmp/flips/flips --create --bps-delta base/firered.gba pokefirered-release.gba "pokemon-canvas-$TAG.bps"
          ls -l "pokemon-canvas-$TAG.bps"

      - name: Write the release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "## Pokémon Canvas $TAG"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s' "$prev..$TAG"
            else
              echo "The first public release."
            fi
            cat .github/release_footer.md
          } > notes.md
          cat notes.md

      - name: Copy the code to the public repo
        run: |
          # Checkout leaves this repo's own token in an auth header that git would send
          # instead of the one in the URL, and that token can't write to the public repo.
          git config --local --unset-all http.https://github.com/.extraheader || true
          url="https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/$PUBLIC_REPO.git"
          git push "$url" "$TAG^{commit}:refs/heads/main" --force
          git push "$url" "refs/tags/$TAG" --force

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # (the PDFs keep the same names every version, so .../releases/latest/download/<name>
          # always links to the newest)
          files=("pokemon-canvas-$TAG.bps" Pokemon-Canvas-Players-Guide.pdf Pokemon-Canvas-Pokedex.pdf)
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$PUBLIC_REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$PUBLIC_REPO" \
              --title "Pokémon Canvas $TAG" --notes-file notes.md --latest
          fi
