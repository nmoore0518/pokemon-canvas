# Builds the game every time something is pushed to main, and attaches the
# playable ROM to the run. To download it: GitHub repo -> Actions tab -> the
# latest "Build ROM" run -> "gym-trainer-hack-rom" under Artifacts.
name: Build ROM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build FireRed
        run: make firered -j$(nproc) -O

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: gym-trainer-hack-rom
          path: pokefirered.gba
          retention-days: 30

      - name: Run Gym Trainer tests
        run: make check BUILD=firered TESTS="GymHack" -j$(nproc)
